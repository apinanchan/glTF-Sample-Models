// ============================================================
// rAthena Login Server Configuration
// ============================================================

// Login Server Port
login_port: 6900

// Log failed login attempts
log_login: yes

// Number of failed attempts before ban
allowed_regs: 5
time_allowed: 10

// Account registration via client allowed
new_account: yes

// New character deletion delay (in seconds, 0 = disabled)
char_del_delay: 0

// Allow use of MD5 encrypted passwords
use_MD5_passwords: yes

// Minimum/Maximum password length
pass_len_min: 4
pass_len_max: 32

// Default group for new accounts
start_limited_time: -1

// IP ban configuration
ipban_enable: yes
ipban_cleanup_interval: 60
ipban_login_attempt: 5
ipban_units: minutes
ipban_duration: 5

// Import
import: conf/import/login_conf.txt
