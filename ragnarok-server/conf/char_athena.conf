// ============================================================
// rAthena Char Server Configuration
// Private Server - Episode 21 | Class 4 | Max 275/60
// ============================================================

// Login Server IP (where char server connects to login server)
login_ip: 127.0.0.1
login_port: 6900

// Char Server IP (what clients connect to)
char_ip: 127.0.0.1
char_port: 6121

// Server name displayed in client
server_name: Ragnarok Private

// Wisp name for server messages
wisp_server_name: Server

// Maximum players online
max_connect_user: 200

// Maximum characters per account
char_per_account: 9

// Deletion delay (in seconds, 0 = instant)
char_del_delay: 0

// Allow deletion of characters with items
char_del_option: 1

// Allow storage on login
storage_limited_slots: 600

// Starting point after char creation
start_point: new_1-1,53,111
start_point_pre: new_1-1,53,111

// Starting zeny
start_zeny: 0

// Starting items (item_id,amount)
start_items: 1201,1,0:2301,1,0

// Pincode system
pincode_enabled: no

// Broadcast to all maps when player connects
faction_connected: no

// Import
import: conf/import/char_conf.txt
