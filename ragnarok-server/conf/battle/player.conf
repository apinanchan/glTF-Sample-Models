// ============================================================
// Battle Config - Player Settings
// Private Server: Episode 21 | Class 4 | Max 275/60
// ============================================================

// Maximum base level (Episode 21 = 275)
max_lv: 275

// Maximum job level (Class 4 = 60)
max_joblv: 60

// Maximum base level for baby classes
baby_max_lv: 175

// Maximum job level for baby classes
baby_max_joblv: 50

// Allow players to be resurrected after death
restart_hp_rate: 0
restart_sp_rate: 0

// Death penalty (0 = none, 1 = base exp, 2 = base+job exp)
death_penalty_type: 0
death_penalty_base: 0
death_penalty_job: 0

// Weight limit factor
weight_penalty: 0

// Allow skill reset via NPC
skill_drop_items_full: no

// Job change cost (0 = free)
job_change_cost: no

// HP/SP display
display_status_timers: yes

// Cart weight limit (overweight %)
cart_weight_limit: 8000

// Allow 3rd and 4th job stat bonuses from the start
override_mob_info: no

import: conf/import/player_conf.txt
