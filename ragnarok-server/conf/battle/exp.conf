// ============================================================
// Battle Config - Experience Rates
// ============================================================

// Base experience rate (100 = 1x, 200 = 2x, etc.)
base_exp_rate: 100

// Job experience rate
job_exp_rate: 100

// Quest experience rate
quest_exp_rate: 100

// MVP bonus experience rate
mvp_exp_rate: 100

// Allow experience gain in PvP maps
pvp_exp: no

// Maximum base level gap between party members for shared exp
party_exp_penalty: yes
party_exp_penalty_base: 15
party_exp_penalty_job: 15

// Bonus experience rate for party members
party_bonus_exp: 0

// Experience modifier for player vs. player kills
pk_mode_exp: yes

// Quests give this percentage more exp
quest_exp_rate: 100

import: conf/import/exp_conf.txt
