// ============================================================
// Battle Config - Miscellaneous Settings
// Private Server: Episode 21 | Class 4
// ============================================================

// Episode/renewal mode (required for 4th jobs and ep21 content)
// Renewal is enabled at compile time via ./configure --enable-renewal

// Announce MVP spawn to all players on the map
mvp_hp_announce: 0

// Item drop announcements (0 = none, 1 = MVPs, 2 = all boss)
item_drop_announce: 0

// Allow WoE (War of Emperium)
siege_time_limit: 600

// Log chat messages
log_chat: 0

// Show SP/HP bars above characters
show_hp_sp_drain: no

// Skill delay base
min_skill_delay_limit: 100

// Allow AFK auto-follow
follow_system: yes

// Manner points system
manner_system: 15

// Maximum number of memos (saved warp points)
memo_max: 3

// Enable 4th job related systems
// (Automatic when using rAthena with renewal + level 275 enabled)

import: conf/import/misc_conf.txt
